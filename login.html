<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Veliki Data Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-left">
            <div class="login-brand">
                <a href="index.html" class="logo"><img src="assets/logo_0002.webp" alt="Veliki Logo" style="height: 40px; vertical-align: middle;"></a>
            </div>
            <div class="login-left-content">
                <h2>Welcome Back!</h2>
                <p>Access your enterprise analytics dashboard and unlock the power of your data.</p>
                
                <div class="glass-stats">
                    <div class="glass-stat">
                        <h4>99.9%</h4>
                        <span>Uptime</span>
                    </div>
                    <div class="glass-stat">
                        <h4>Real-time</h4>
                        <span>Processing</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="login-right">
            <div class="login-form-wrapper glassmorphism">
                <div style="text-align: left; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-start;">
                    <a href="index.html"><img src="assets/logo_0002.webp" alt="Veliki Logo" style="height: 30px;"></a>
                    <a href="index.html" style="color: #94a3b8; font-size: 0.75rem; text-decoration: none; display: flex; align-items: center; gap: 0.3rem;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#94a3b8'">
                        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        Back to Home
                    </a>
                </div>
                <h3>Sign In</h3>
                <p>Enter your credentials to continue.</p>
                
                <!-- Unique Role Selection Toggle -->
                <div class="role-toggle-container" id="auth-role-toggle">
                    <div class="role-slider"></div>
                    <div class="role-btn active" data-role="admin">Admin</div>
                    <div class="role-btn" data-role="customer">Customer</div>
                </div>
                
                <form class="login-form" id="auth-login-form">
                    <div class="input-group">
                        <input type="email" id="email" placeholder=" " required>
                        <label for="email">Work Email</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" placeholder=" " minlength="8" required>
                        <label for="password">Password</label>
                    </div>
                    
                    <div class="form-actions">
                        <label class="checkbox-container">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="404.html" class="forgot-pass">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="btn-primary full-width">Sign In to Dashboard</button>
                    
                    <div class="sso-login">
                        <p>Or sign in with</p>
                        <div class="sso-buttons">
                            <button type="button" class="btn-sso" onclick="window.location.href='404.html'">Google</button>
                            <button type="button" class="btn-sso" onclick="window.location.href='404.html'">Microsoft</button>
                        </div>
                    </div>
                </form>
                
                <p class="signup-link">Don't have an account? <a href="signup.html">Create Account</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init({ duration: 800, once: true, offset: 100 });
</script>
</body>
</html>
