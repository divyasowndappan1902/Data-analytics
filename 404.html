<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Veliki</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container" style="align-items: center; justify-content: center; display: flex; height: 100vh;">
        <div class="login-form-wrapper glassmorphism" style="text-align: center; padding: 4rem 2rem; max-width: 500px;">
            <div style="margin-bottom: 2rem;">
                <a href="index.html"><img src="assets/logo_0002.webp" alt="Veliki Logo" style="height: 50px;"></a>
            </div>
            <div style="position: relative; margin-bottom: 2rem; display: flex; justify-content: center; align-items: center;">
                <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:var(--primary-color);stop-opacity:1" />
                            <stop offset="100%" style="stop-color:var(--secondary-color);stop-opacity:1" />
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Orbiting dashed circle -->
                    <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-dasharray="10 10">
                        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="100" cy="100" r="60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="5 5">
                        <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="15s" repeatCount="indefinite" />
                    </circle>

                    <!-- Floating inner element -->
                    <g filter="url(#glow)">
                        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="4s" repeatCount="indefinite" />
                        <circle cx="100" cy="100" r="40" fill="url(#grad1)" opacity="0.8" />
                        <text x="100" y="110" font-family="'Outfit', sans-serif" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">404</text>
                    </g>
                    
                    <!-- Satellites -->
                    <circle cx="20" cy="100" r="6" fill="var(--secondary-color)" filter="url(#glow)">
                        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="160" cy="100" r="4" fill="var(--primary-color)">
                        <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="15s" repeatCount="indefinite" />
                    </circle>
                </svg>
            </div>
            <h3 style="font-size: 1.5rem; margin-bottom: 1rem;">Oops! Page Not Found</h3>
            <p style="color: var(--text-muted); margin-bottom: 2.5rem; font-size: 1rem;">The page you are looking for does not exist, has been removed, or is temporarily unavailable.</p>
            
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <button onclick="window.history.back()" style="padding: 0.8rem 2rem; border: 1px solid rgba(255,255,255,0.2); border-radius: 50px; background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.3s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">Go Back</button>
                <a href="index.html" class="btn-primary" style="display: inline-block; padding: 0.8rem 2rem;">Return to Homepage</a>
            </div>
        </div>
    </div>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init({ duration: 800, once: true, offset: 100 });
</script>
</body>
</html>
